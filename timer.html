<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一起专注计时器 | Leappo澳洲</title>
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/widget.css">
<style>
.stage{display:flex;flex-direction:column;align-items:center;padding:20px 16px 22px;gap:14px}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--border-card);background:#fff;font-weight:800}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow)}
.dial{position:relative;width:min(260px,70vw);aspect-ratio:1}
.dial svg{width:100%;height:100%}
.dial img{position:absolute;left:50%;top:50%;width:46%;transform:translate(-50%,-50%)}
.time{font-family:var(--font-serif);font-size:44px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.state{color:var(--muted);font-size:16px;min-height:1.6em;text-align:center}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:15px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:6px;min-height:36px}
</style></head><body><main class="wrap">
<div class="eyebrow">LEAPPO 澳洲 · 一起专注</div>
<h1>开一个番茄钟</h1>
<p class="sub">选个时长，点开始。看着颜色慢慢变少就行。</p>
<section class="card stage">
 <div class="presets" role="group" aria-label="专注时长">
  <button class="chip" data-m="15" aria-pressed="false">15 分钟</button>
  <button class="chip" data-m="25" aria-pressed="true">25 分钟</button>
  <button class="chip" data-m="50" aria-pressed="false">50 分钟</button>
 </div>
 <div class="dial" aria-hidden="true">
  <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#fcf7f3" stroke="rgba(102,54,37,.18)" stroke-width="2"/>
   <path id="wedge" fill="#b5b6fb"/></svg>
  <img id="pic" src="assets/tomato.png" alt="">
 </div>
 <div class="time" id="time" role="timer" aria-live="off">25:00</div>
 <div class="state" id="state" aria-live="polite">准备好了就点开始</div>
 <div class="ctrl">
  <button class="btn" id="go">开始</button>
  <button class="btn ghost" id="reset">重来</button>
 </div>
 <div class="opts">
  <label><input type="checkbox" id="snd"> 结束时轻响一声</label>
  <label><input type="checkbox" id="brk" checked> 结束后休息 5 分钟</label>
 </div>
</section>
<p class="foot">想有人陪着做，左边「🔊随时自习室」一直开着，进去静音坐着就行。计时只在你自己的设备上运行，不会被记录。</p>
</main>
<script>
const $=id=>document.getElementById(id);
let mins=25,total=mins*60,left=total,timer=null,phase='focus',endAt=0;
const P={focus:'assets/tomato.png',rest:'assets/rest.png',done:'assets/done-counts.png'};
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function wedge(frac){ // remaining fraction, drawn clockwise from 12 o'clock
 const r=92,a=frac*2*Math.PI; if(frac<=0){$('wedge').setAttribute('d','');return}
 if(frac>=.9999){$('wedge').setAttribute('d','M100,8 A92,92 0 1,1 100,192 A92,92 0 1,1 100,8 Z');return}
 const x=100+r*Math.sin(a),y=100-r*Math.cos(a);
 $('wedge').setAttribute('d',`M100,100 L100,8 A92,92 0 ${a>Math.PI?1:0},1 ${x.toFixed(2)},${y.toFixed(2)} Z`);
 $('wedge').setAttribute('fill',phase==='rest'?'#f1f77e':'#b5b6fb');
}
function draw(){ $('time').textContent=fmt(left); wedge(left/total); document.title=(timer?fmt(left)+' · ':'')+'一起专注计时器'; }
function chime(){ if(!$('snd').checked) return; try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(.12,c.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+1.2);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+1.3)}catch(e){} }
function tick(){ left=(endAt-Date.now())/1000; if(left<=0){ left=0; stop(); chime(); finish(); } draw(); }
function start(){ endAt=Date.now()+left*1000; timer=setInterval(tick,250); $('go').textContent='暂停';
 $('state').textContent=phase==='rest'?'休息一下，起来喝口水':'专注中。走神了就回来，不用自责'; }
function stop(){ clearInterval(timer); timer=null; $('go').textContent='继续'; }
function setPhase(p,m){ phase=p; total=m*60; left=total; $('pic').src=P[p==='rest'?'rest':'focus']; $('go').textContent='开始'; draw(); }
function finish(){
 if(phase==='focus'){ $('pic').src=P.done; $('state').textContent='这一轮完成了。做了就算数。';
  if($('brk').checked){ setPhase('rest',5); $('pic').src=P.done; $('state').textContent='这一轮完成了。点开始，休息 5 分钟。'; } else { $('go').textContent='再来一轮'; left=total=mins*60; } }
 else { setPhase('focus',mins); $('state').textContent='休息好了。想继续就再点开始。'; }
}
$('go').onclick=()=>{ timer?(stop(),$('state').textContent='暂停了，准备好再继续'):start(); };
$('reset').onclick=()=>{ if(timer) stop(); setPhase('focus',mins); $('state').textContent='准备好了就点开始'; };
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ if(timer) stop(); document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false')); c.setAttribute('aria-pressed','true'); mins=+c.dataset.m; setPhase('focus',mins); $('state').textContent='准备好了就点开始'; });
draw();
</script></body></html>
