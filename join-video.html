<details><summary>不想看视频？这里是文字版</summary>
<p>1. 左边点「一起专注」，选一场自习室，点 RSVP。活动会进你的日历，提前一天和一小时提醒你。<br>2. 到点打开活动，进它的语音房。<br>3. 摄像头、麦克风都可以关，在聊天框打一个 🍅 就算到了。电脑上可以开视频，手机 App 只有语音。<br>4. 迟到、早退都没关系。每周二晚 8 点专注 50 分钟，周六早 10 点番茄钟 25 分钟 × 3。其他时间「🔊随时自习室」一直开着。</p>
<p>这是同伴陪伴活动，不是治疗或辅导。</p></details>
